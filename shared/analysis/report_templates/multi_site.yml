# 多点鉴定试验报告编排（体裁：多点鉴定）
#
# 与 primary.yml（初级产比）的差异：
#   · 不设「杂交组合 / 亲本」两节 —— 外部鉴定试验没有亲本信息（ma/pa 全空）
#   · 新增「跨点表现」核心节：跨点排名 / 各点产量矩阵 / GGE 稳定性 / 增产点次
#   · 筛选口径不同：多点鉴定看「增产点次」与「跨点稳定性」，不是单点位次
#
# 表/图编号按 blocks 出现顺序分配（表、图各自独立计数）。
template_id: multi_site
stage_no: 5
appendix_prefix: A
blocks:
  # ---- 7.1 产量总体水平 ----
  - {id: tbl_yield_core,      kind: table,  section: "7.1", title: "产量核心统计（全部点合并）"}
  - {id: fig_yield_dist,      kind: figure, section: "7.1", plot_key: yield_dist}
  - {id: fig_yield_grade,     kind: figure, section: "7.1", plot_key: yield_grade_dist}
  - {id: fig_increase,        kind: figure, section: "7.1", plot_key: increase_dist}
  - {id: fig_growth,          kind: figure, section: "7.1", plot_key: growth_dist}

  # ---- 7.2 跨点表现（多点鉴定的核心） ----
  - {id: tbl_cross_location_avg, kind: table,  section: "7.2", title: "跨点平均表现与增产点次（{n_material} 份材料）"}
  - {id: tbl_cross_site_matrix,  kind: table,  section: "7.2", title: "各点亩产矩阵（kg/亩，按跨点平均排序）"}
  - {id: fig_gge_biplot,         kind: figure, section: "7.2", plot_key: gge_biplot}
  - {id: fig_gge_heatmap,        kind: figure, section: "7.2", plot_key: gge_heatmap}
  - {id: tbl_gge_stability,      kind: table,  section: "7.2", title: "GGE 稳定性参数"}
  - {id: fig_gge_ranking,        kind: figure, section: "7.2", plot_key: gge_ranking}

  # ---- 7.3 形态性状 ----
  - {id: fig_quality_huase,      kind: figure, section: "7.3", plot_key: "quality_花色"}
  - {id: fig_quality_yexing,     kind: figure, section: "7.3", plot_key: "quality_叶形"}
  - {id: fig_quality_rongmaose,  kind: figure, section: "7.3", plot_key: "quality_茸毛色"}
  - {id: fig_quality_jiejiaxixing, kind: figure, section: "7.3", plot_key: "quality_结荚习性"}
  - {id: fig_quality_daofuxing,   kind: figure, section: "7.3", plot_key: "quality_倒伏性"}

  # ---- 7.4 生育期与产量关系 ----
  - {id: tbl_growth_bin,      kind: table,  section: "7.4", title: "生育期分箱与平均亩产（材料层，n = {n_mat_yield}）"}
  - {id: fig_scatter_growth,  kind: figure, section: "7.4", plot_key: scatter_growth}
  - {id: fig_scatter_height,  kind: figure, section: "7.4", plot_key: scatter_height}

  # ---- 7.5 筛选与晋级 ----
  - {id: tbl_screening_rules, kind: table,  section: "7.5", title: "筛选规则（管线口径）"}
  - {id: tbl_promoted_no_sep, kind: table,  section: "7.5", title: "晋级材料——无性状分离（{promoted_no_sep_n} 份）"}
  - {id: tbl_promoted_sep,    kind: table,  section: "7.5", title: "晋级材料——有性状分离、需提纯（{promoted_sep_n} 份）"}
  - {id: fig_comparison,      kind: figure, section: "7.5", plot_key: comparison}
  - {id: tbl_ms_threshold_scan, kind: table, section: "7.5", title: "多点晋级口径敏感性（管线实跑）"}

  # ---- 7.6 推荐材料 ----
  - {id: tbl_top5,            kind: table,  section: "7.6", title: "产量前 5 材料（跨点平均）"}
  - {id: fig_radar,           kind: figure, section: "7.6", plot_key: radar}

  # ---- 附录 A.4 田间评价 ----
  - {id: tbl_a4_rounds,       kind: table,  section: "A.4", title: "田间评价"}
  - {id: tbl_a4_sources,      kind: table,  section: "A.4", title: "各来源覆盖情况"}
  - {id: tbl_a4_field_eval,   kind: table,  section: "A.4", title: "材料田间评价表（按亩产降序）"}
